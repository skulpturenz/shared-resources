networks:
  default:
    name: flipt
    driver: overlay
    attachable: true

secrets:
  proxy.certificate:
    file: ${PROXY_CERT_PATH}
  proxy.key:
    file: ${PROXY_KEY_PATH}

services:
  proxy:
    image: traefik:v3.4
    ports:
      - target: 443
        published: 443
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
    command: >
      --providers.swarm.endpoint=unix:///var/run/docker.sock
      --providers.swarm.exposedByDefault=false
      --providers.file.directory=/traefik
      --providers.file.watch=true
      --entryPoints.web.address=:80
      --entryPoints.websecure.address=:443
      --entryPoints.websecure.asDefault=true
      --entryPoints.web.http.redirections.entryPoint.to=websecure
      --entryPoints.web.http.redirections.entryPoint.scheme=https
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/traefik
    secrets:
      - source: proxy.certificate
        target: /certs/fullchain.pem
      - source: proxy.key
        target: /certs/privkey.pem
    ulimits:
      nofile:
        soft: 20000
        hard: 20000

  flipt:
    image: docker.flipt.io/flipt/flipt:${FLIPT_VERSION}
    environment:
      FLIPT_LOG_LEVEL: ${FLIPT_LOG_LEVEL:-ERROR}
      FLIPT_DB_URL: ${POSTGRES_CONNECTION_STRING}
      FLIPT_CORS_ALLOWED_ORIGINS: "*"
      FLIPT_CORS_ENABLED: "true"
      FLIPT_META_CHECK_FOR_UPDATES: "true"
      FLIPT_TELEMETRY_ENABLED: "false"
      FLIPT_AUTHORIZATION_REQUIRED: ${FLIPT_AUTHORIZATION_REQUIRED}
      FLIPT_AUTHENTICATION_REQUIRED: ${FLIPT_AUTHENTICATION_REQUIRED}
      FLIPT_AUTHENTICATION_EXCLUDE_EVALUATION: "true"
      FLIPT_AUTHENTICATION_EXCLUDE_OFREP: "true"
      FLIPT_AUTHENTICATION_SESSION_SECURE: "true"
      FLIPT_AUTHENTICATION_SESSION_DOMAIN: ${FLIPT_AUTHENTICATION_SESSION_DOMAIN}
      FLIPT_AUTHENTICATION_SESSION_CSRF_KEY: ${FLIPT_CSRF_KEY}
      FLIPT_AUTHENTICATION_METHODS_TOKEN_ENABLED: "true"
      FLIPT_AUTHENTICATION_METHODS_TOKEN_TOKENS: "BOOTSTRAP"
      FLIPT_AUTHENTICATION_METHODS_TOKEN_TOKENS_BOOTSTRAP_CREDENTIAL: ${BOOTSTRAP_TOKEN}
      FLIPT_AUTHENTICATION_METHODS_OIDC_ENABLED: "true"
      FLIPT_AUTHENTICATION_METHODS_OIDC_EMAIL_MATCHES: ${FLIPT_ALLOWED_EMAILS_REGEX}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_GOOGLE_ISSUER_URL: "https://accounts.google.com"
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_GOOGLE_CLIENT_ID: ${FLIPT_GOOGLE_OIDC_CLIENT_ID}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_GOOGLE_CLIENT_SECRET: ${FLIPT_GOOGLE_OIDC_CLIENT_SECRET}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_GOOGLE_REDIRECT_ADDRESS: ${FLIPT_GOOGLE_OIDC_REDIRECT_ADDRESS}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_GOOGLE_SCOPES: "email"
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_SKULPTURE_ISSUER_URL: "https://authnz.skulpture.xyz/realms/master"
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_SKULPTURE_CLIENT_ID: ${FLIPT_SKULPTURE_OIDC_CLIENT_ID}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_SKULPTURE_CLIENT_SECRET: ${FLIPT_SKULPTURE_OIDC_CLIENT_SECRET}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_SKULPTURE_REDIRECT_ADDRESS: ${FLIPT_SKULPTURE_OIDC_REDIRECT_ADDRESS}
      FLIPT_AUTHENTICATION_METHODS_OIDC_PROVIDERS_SKULPTURE_SCOPES: "email"
      FLIPT_ENVIRONMENTS_MASTER_NAME: "master"
      FLIPT_ENVIRONMENTS_MASTER_STORAGE: "master"
      FLIPT_ENVIRONMENTS_STAGING_NAME: "staging"
      FLIPT_ENVIRONMENTS_STAGING_STORAGE: "staging"
      FLIPT_ENVIRONMENTS_DEV_NAME: "dev"
      FLIPT_ENVIRONMENTS_DEV_STORAGE: "dev"
      FLIPT_STORAGE_MASTER_NAME: "master"
      FLIPT_STORAGE_MASTER_REMOTE: "https://github.com/skulpturenz/rollout-storage.git"
      FLIPT_STORAGE_MASTER_BRANCH: "master"
      FLIPT_STORAGE_MASTER_CREDENTIALS: "github"
      FLIPT_STORAGE_STAGING_NAME: "staging"
      FLIPT_STORAGE_STAGING_REMOTE: "https://github.com/skulpturenz/rollout-storage.git"
      FLIPT_STORAGE_STAGING_BRANCH: "staging"
      FLIPT_STORAGE_STAGING_CREDENTIALS: "github"
      FLIPT_STORAGE_DEV_NAME: "dev"
      FLIPT_STORAGE_DEV_REMOTE: "https://github.com/skulpturenz/rollout-storage.git"
      FLIPT_STORAGE_DEV_BRANCH: "dev"
      FLIPT_STORAGE_DEV_CREDENTIALS: "github"
      FLIPT_CREDENTIALS_GITHUB_TYPE: "access_token"
      FLIPT_CREDENTIALS_GITHUB_ACCESS_TOKEN: ${FLIPT_CREDENTIALS_GITHUB_ACCESS_TOKEN}
      FLIPT_CACHE_ENABLED: "true"
      OTLP_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318
      # Disabled for now, very noisy 60 requests per minute and unnecessary
      FLIPT_METRICS_ENABLED: "false"
      FLIPT_METRICS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318
      FLIPT_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318
      # TODO: reconsider later
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: 0.25
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${GO_ENV},deployment.node={{.Task.Slot}}"
    deploy:
      mode: replicated
      replicas: 2
      labels:
        traefik.enable: "true"
        traefik.http.routers.rollout.rule: Host(`rollout.skulpture.xyz`)
        traefik.http.routers.rollout.tls.domains.main: skulpture.xyz
        traefik.http.routers.rollout.tls.domains.sans: "*.skulpture.xyz"
        traefik.http.routers.rollout.middlewares: cors, rollout-inflightreq-limit, rollout-service-limit
        traefik.http.services.rollout-service.loadbalancer.server.port: 8080
        traefik.http.services.rollout-service.loadbalancer.server.scheme: http
        traefik.http.services.rollout-service.loadbalancer.healthcheck.path: /health
        traefik.http.services.rollout-service.loadbalancer.healthcheck.status: 200
        traefik.http.services.rollout-service.loadbalancer.healthcheck.port: 8080
        traefik.http.services.rollout-service.loadbalancer.sticky.cookie.secure: "true"
        traefik.http.services.rollout-service.loadbalancer.sticky.cookie.httpOnly: "true"
        traefik.http.services.rollout-service.loadbalancer.sticky.cookie.domain: rollout.skulpture.xyz
        traefik.http.middlewares.cors.headers.accesscontrolallowmethods: "*"
        traefik.http.middlewares.cors.headers.accesscontrolallowheaders: "*"
        traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist: "*"
        traefik.http.middlewares.cors.headers.accesscontrolmaxage: 100
        traefik.http.middlewares.cors.headers.addvaryheader: "true"
        traefik.http.middlewares.rollout-inflightreq-limit.inflightreq.amount: 5
        # Proxied by CloudFlare only before reaching the VM
        # Rate limiting from traefik happens before it proxies
        traefik.http.middlewares.rollout-inflightreq-limit.inflightreq.sourcecriterion.ipstrategy.depth: 1
        traefik.http.middlewares.rollout-service-limit.ratelimit.average: 5
        traefik.http.middlewares.rollout-service-limit.ratelimit.burst: 10
        # Proxied by CloudFlare only before reaching the VM
        # Rate limiting from traefik happens before it proxies
        traefik.http.middlewares.rollout-service-limit.ratelimit.sourcecriterion.ipstrategy.depth: 1
        traefik.swarm.lbswarm: "false"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./otel/collector-config.yml:/etc/otelcol-contrib/config.yaml
    deploy:
      mode: replicated
      replicas: 1
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_AUTH_TOKEN: ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}
