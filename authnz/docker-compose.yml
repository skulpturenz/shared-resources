networks:
  default:
    name: keycloak
    driver: overlay
    attachable: true

volumes:
  filebeat-data:
  heartbeat-data:
  metricbeat-data:

secrets:
  proxy.certificate:
    file: ${PROXY_CERT_PATH}
  proxy.key:
    file: ${PROXY_KEY_PATH}

services:
  proxy:
    image: traefik:v3.4
    ports:
      - target: 443
        published: 443
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
    command: >
      --providers.swarm.endpoint=unix:///var/run/docker.sock
      --providers.swarm.exposedByDefault=false
      --providers.file.directory=/traefik
      --providers.file.watch=true
      --entryPoints.web.address=:80
      --entryPoints.websecure.address=:443
      --entryPoints.websecure.asDefault=true
      --entryPoints.web.http.redirections.entryPoint.to=websecure
      --entryPoints.web.http.redirections.entryPoint.scheme=https
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/traefik
    secrets:
      - source: proxy.certificate
        target: /certs/fullchain.pem
      - source: proxy.key
        target: /certs/privkey.pem
    ulimits:
      nofile:
        soft: 20000
        hard: 20000

  keycloak:
    image: skulpture/authnz:${TAG:-latest}
    hostname: keycloak.{{.Task.Slot}}
    environment:
      KC_CACHE: ispn
      KC_CACHE_STACK: kubernetes
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: ${KC_DB_POOL_INITIAL_SIZE:-1}
      KC_DB_POOL_MAX_SIZE: ${KC_DB_POOL_MAX_SIZE:-2}
      KC_DB_POOL_MIN_SIZE: ${KC_DB_POOL_MIN_SIZE:-0}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Djgroups.dns.query=tasks.keycloak -Djgroups.bind_addr=match-address:10.0.2.*"
      # with otel agent
      # JAVA_OPTS_APPEND: "-javaagent:/tmp/opentelemetry-javaagent.jar -Djgroups.dns.query=tasks.keycloak -Djgroups.bind_addr=match-address:10.0.2.*"
      OTEL_SERVICE_NAME: keycloak
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${JAVA_ENV},deployment.node={{.Task.Slot}}"
    command: "start --optimized --http-enabled true --proxy-headers xforwarded"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/health/ready || test $$? -eq 8 || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m
    deploy:
      mode: replicated
      replicas: 2
      labels:
        traefik.enable: "true"
        traefik.http.routers.authnz.rule: Host(`authnz.skulpture.xyz`)
        traefik.http.routers.authnz.tls.domains.main: skulpture.xyz
        traefik.http.routers.authnz.tls.domains.sans: "*.skulpture.xyz"
        traefik.http.services.authnz-service.loadbalancer.server.port: 8080
        traefik.http.services.authnz-service.loadbalancer.server.scheme: http
        traefik.http.services.authnz-service.loadbalancer.healthcheck.path: /health/ready
        traefik.http.services.authnz-service.loadbalancer.healthcheck.status: 200
        traefik.http.services.authnz-service.loadbalancer.healthcheck.port: 9000
        traefik.swarm.lbswarm: "false"

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_HOST_PORT: https://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      LS_JAVA_OPTS: "-Xmx${LOGSTASH_HEAP} -Xms${LOGSTASH_HEAP} -Dlog4j2.formatMsgNoLookups=true"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "-XGET", "http://127.0.0.1:9600" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m
    deploy:
      mode: replicated
      replicas: 0 # 1

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    # -e flag to log to stderr and disable syslog/file output
    command: -e --strict.perms=false
    user: root
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_HOST_PORT: https://${KIBANA_HOST}:${KIBANA_PORT}
      ELASTICSEARCH_HOST_PORT: https://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
    volumes:
      - ./filebeat/filebeat.docker.logs.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/var/lib/filebeat/data
    deploy:
      mode: replicated
      replicas: 0 # 1
    healthcheck:
      test: [ "CMD", "curl", "-sf", "-XGET", "localhost:5066/?pretty" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:${ELK_VERSION}
    volumes:
      - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
      - heartbeat-data:/var/lib/heartbeat/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: root
    cap_add: [ "NET_RAW" ]
    command: -e --strict.perms=false
    deploy:
      mode: replicated
      replicas: 0 # 1
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_HOST_PORT: https://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      KEYCLOAK_PUBLIC_HOST: ${KC_HOSTNAME}
      JAVA_ENV: ${JAVA_ENV}
    healthcheck:
      test: [ "CMD", "curl", "-sf", "-XGET", "localhost:5066/?pretty" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${ELK_VERSION}
    user: root
    command: --strict.perms=false -e
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro # Only available on Linux
      - /proc:/hostfs/proc:ro # Only available on Linux
      - /:/hostfs:ro
      - metricbeat-data:/var/lib/metricbeat/data
    deploy:
      mode: replicated
      replicas: 0 # 1
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_HOST_PORT: https://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
    healthcheck:
      test: [ "CMD", "curl", "-sf", "-XGET", "localhost:5066/?pretty" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 1m
